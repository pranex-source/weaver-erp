<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labour Page - Handloom Automation</title>

    <link rel="stylesheet" href="style1.css" type="text/css">

    <style>
        main { 
            max-width: 700px; 
            margin: 32px auto; 
            padding: 0 16px; 
        }
        .history { 
            background: white; 
            border-radius: 10px; 
            border-top: 4px solid #d1a94b;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            padding: 24px; 
        }
        .history p { 
            margin-bottom: 10px; 
        }
        table { 
            width: 100%; 
            margin-top: 8px; 
        }
        th, td { 
            border: 1px solid #d9cfba; 
            padding: 8px; 
            text-align: left; 
        }
        th { 
            background: #1f5f6b; 
            color: white; 
        }
    </style>
</head>
<body>

    <header>
        <h1>Handloom Automation</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    
    <section class="hero">
        <h2>Labour Dashboard</h2>
         <div class="zari"></div>
        <p>Track your full income history, including exact transaction dates and totals.</p>
    </section>

    <main>
        <h2 class="section-title">Labour Page</h2>
        <div class="history" id="historyBox"></div>
    </main>

    <footer>
        <p>&copy; 2026 Co-Operative Handloom Automation System. All Rights Reserved.</p>
    </footer>

  
    <script id="startData" type="application/json">
    {
      "labours": [
        { "id": "H001", "name": "Praveen", "materialType": "Silk", "sarees": 10, "assignedDate": "2026-09-22", "completionDate": "2026-10-23", "salary": [ { "date": "2026-10-24", "amount": 10000 } ] }
      ]
    }
    </script>

    <script>
            // 1. Fetch the data about the workers
        let savedData = localStorage.getItem("labours");
        let labours;

        if (savedData) {
            // If we have saved data before, turn it back into a JavaScript list
            labours = JSON.parse(savedData);
        } else {
            // Otherwise, grab the starting data hidden inside the HTML page
            let startDataText = document.getElementById("startData").textContent;
            let parsedStartData = JSON.parse(startDataText);
            labours = parsedStartData.labours;
        }

        // 2. Find the specific worker with ID "H001"
        let currentLabour = null;
        for (let i = 0; i < labours.length; i++) {
            if (labours[i].id === "H001") {
                currentLabour = labours[i]; // We found them!
                break; // Stop looking through the list
            }
        }

        // 3. A function to change date format (Example: "2026-10-23" becomes "23.10.26")
        function formatDate(dateString) {
            if (!dateString) {
                return "-"; // If there is no date, just show a dash
            }
            // Split the date text everywhere there is a hyphen "-"
            let parts = dateString.split("-"); // parts[0] = "2026", parts[1] = "10", parts[2] = "23"
            let day = parts[2];
            let month = parts[1];
            let year = parts[0].slice(2); // slice(2) takes just the last two digits ("26")
            
            return day + "." + month + "." + year;
        }

        // 4. Figure out what material the worker was given
        let materialText = "";
        if (currentLabour.sarees > 0) {
            materialText = currentLabour.materialType + ", " + currentLabour.sarees + " sarees";
        } else {
            materialText = "Nothing assigned yet";
        }

        // 5. Build the Salary History table rows
        let tableRows = "<tr><th>Date</th><th>Amount</th></tr>";
        for (let j = 0; j < currentLabour.salary.length; j++) {
            let payment = currentLabour.salary[j];
            let formattedDate = formatDate(payment.date);
            
            // Add a new row to our table for this payment
            tableRows = tableRows + "<tr><td>" + formattedDate + "</td><td>" + payment.amount + "</td></tr>";
        }

        // 6. Put all this information directly onto the webpage inside the "historyBox" element
        document.getElementById("historyBox").innerHTML =
            "<h3>My History</h3>" +
            "<p>Name: <b>" + currentLabour.name + "</b></p>" +
            "<p>ID: <b>" + currentLabour.id + "</b></p>" +
            "<p>Material Received: <b>" + formatDate(currentLabour.assignedDate) + "</b></p>" +
            "<p>Material Submission: <b>" + formatDate(currentLabour.completionDate) + "</b></p>" +
            "<p>Material Type &amp; Count: <b>" + materialText + "</b></p>" +
            "<h3>Salary History</h3><table>" + tableRows + "</table>";

    </script>
</body>
</html>
